<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMR Central Eluru</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mute:#5b6682;--line:#dbe2ef;--brand:#323061;--on-brand:#fff;--gold:#f2a900;--hd:#323061;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#17233a;--ink:#eaf0fb;--mute:#9aa8c4;--line:#2a3856;--brand:#4fc3d9;--on-brand:#06222a;--hd:#232143;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#17233a;--ink:#eaf0fb;--mute:#9aa8c4;--line:#2a3856;--brand:#4fc3d9;--on-brand:#06222a;--hd:#232143;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;line-height:1.45;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;padding:14px 16px 12px}
h1{font:800 1.45rem "Syne",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px 14px 20px}
.note{background:var(--gold);color:#2b1d00;font-size:.8rem;padding:6px 12px;text-align:center;font-weight:700}
input[type=search]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:600 .9rem inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item h3{margin:0;font-size:1rem}
.item small{color:var(--mute)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--gold);color:#2b1d00;margin-top:4px}
h2{font:800 1.1rem "Syne",system-ui,sans-serif;margin:18px 0 8px}
h2:first-child{margin-top:0}
.empty{color:var(--mute);padding:10px 2px}
a{color:var(--brand);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 4px 9px;font:600 .78rem inherit;cursor:pointer}
nav button span{display:block;font-size:1.3rem}
nav button[aria-selected=true]{color:var(--brand)}

<script>
/* ===== DATA: edit this section with the mall's confirmed details ===== */
const DATA={
shops:[
{n:"Zudio",c:"Fashion",d:"Clothing"},
{n:"Centro",c:"Footwear",d:"Shoes and sneakers"},
{n:"Padmam Silver Jewellery",c:"Jewellery",d:"Silver jewellery"},
{n:"Miniso",c:"Sweets & gifts",d:"Gifts, accessories and beauty items"},
{n:"Pooja's Choco Flow",c:"Sweets & gifts",d:"Chocolates and sweets"},
{n:"Mouth Freshener",c:"Sweets & gifts",d:"Mouth fresheners and candies"},
{n:"Funkeys",c:"Toys & games",d:"Toys and collectible figures"},
{n:"Game Zone",c:"Toys & games",d:"Arcade games and kids' rides"},
{n:"Fish Spa & Relax",c:"Services",d:"Fish spa and massage chairs"},
{n:"Jaipuri Mehendi & Tattoos",c:"Services",d:"Mehendi, tattoos and ear piercing"}],
offers:[],
food:[
{n:"Chaat Mama",k:"Chaat, pav bhaji, tornado potato, sweet lassi"},
{n:"KFC",k:"Fried chicken"},
{n:"BigGuys",k:"Korean fried chicken"},
{n:"Burger Hours",k:"Burgers and fried chicken"},
{n:"Bombay Frankie & Banana Bliss",k:"Frankies and frozen bananas"},
{n:"Cups & Cones",k:"Desserts"},
{n:"Ice Bar",k:"Juices and cold drinks"},
{n:"Just Kitchen",k:"Near the cinema screens"}],
events:[],
visit:{
address:"S.No 39/24, Staff Quarters APSRTC, D.No 27-4-22/1, Narasimharao Pet, Eluru, Andhra Pradesh 534006",
phone:"077999 18639",tel:"+917799918639",events:[["Events and special occasions","+919346114954","093461 14954"],["Surprise and event booking","+918886608929","088866 08929"]],ig:"https://www.instagram.com/cmr_central/",fb:"https://www.facebook.com/cmrcentralmall/",
hours:"Open every day, 10:00 am to 10:30 pm.",
map:"https://maps.app.goo.gl/6dDphTGv6zjpRHdk7"},
cinema:{name:"SVC Cinemas",about:"Four screens, with Barco 4K laser, Dolby Atmos and Active 3D shown at the entrance. Box office is on the cinema floor.",link:"#" /* paste SVC Cinemas booking link here */}
};
const TH={"Zudio":"zudio","Centro":"centro","Padmam Silver Jewellery":"padmam","Miniso":"miniso","Pooja's Choco Flow":"choco","Mouth Freshener":"mouth","Funkeys":"funkeys","Game Zone":"games","Fish Spa & Relax":"fishspa","Jaipuri Mehendi & Tattoos":"jaipuri","Chaat Mama":"chaat","KFC":"kfc","BigGuys":"bigguys","Burger Hours":"burger","Bombay Frankie & Banana Bliss":"bf","Cups & Cones":"cups","Ice Bar":"icebar","Just Kitchen":"justk"};
/* ===== App code ===== */
const $=s=>document.querySelector(s),v=$("#view");
let cat="All",q="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shops(){
const cats=["All",...new Set(DATA.shops.map(s=>s.c))];
const list=DATA.shops.filter(s=>(cat==="All"||s.c===cat)&&(s.n+s.c+s.d).toLowerCase().includes(q.toLowerCase()));
v.innerHTML=`<input type="search" id="q" placeholder="Search shops" value="${esc(q)}" aria-label="Search shops">
<div class="chips">${cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
${list.map(s=>`<div class="item"><div class="im" style="background-image:var(--i-${TH[s.n]||"x"})"></div><div><h3>${esc(s.n)}</h3><small>${esc(s.d)}</small></div></div>`).join("")||'<p class="empty">No shops match. Try another name or category.</p>'}`;
const i=$("#q");i.oninput=()=>{q=i.value;shops();const n=$("#q");n.focus();n.setSelectionRange(q.length,q.length)};
v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;shops()});}
function offers(){v.innerHTML=DATA.offers.map(o=>`<div class="item"><h3>${esc(o.t)}</h3><small>${esc(o.s)}</small><br><span class="tag">${esc(o.d)}</span></div>`).join("")||'<p class="empty">No offers listed yet. Mall staff can add them in the DATA section.</p>'}
function food(){v.innerHTML=DATA.food.map(f=>`<div class="item"><div class="im" style="background-image:var(--i-${TH[f.n]||"x"})"></div><div><h3>${esc(f.n)}</h3><small>${esc(f.k)}</small></div></div>`).join("")}
function info(){const x=DATA.visit,c=DATA.cinema;
v.innerHTML=`<h2>Visit</h2><div class="item"><small>${esc(x.address)}</small><p>${esc(x.hours)}</p><a href="tel:${esc(x.tel)}">Call ${esc(x.phone)}</a><br><a href="${esc(x.map)}" target="_blank" rel="noopener">Get directions</a>${x.events.map(e=>`<p style="margin:10px 0 0"><b>${esc(e[0])}</b><br><a href="tel:${e[1]}">${esc(e[2])}</a></p>`).join("")}<p><a href="${esc(x.ig)}" target="_blank" rel="noopener">Instagram</a> · <a href="${esc(x.fb)}" target="_blank" rel="noopener">Facebook</a></p></div>
<h2>Cinema</h2><div class="item"><h3>${esc(c.name)}</h3><small>${esc(c.about)}</small><p><a href="${esc(c.link)}" target="_blank" rel="noopener">Book tickets</a></p></div>
<h2>Events</h2>${DATA.events.map(e=>`<div class="item"><span class="tag">${esc(e.d)}</span><h3>${esc(e.t)}</h3><small>${esc(e.x)}</small></div>`).join("")||'<p class="empty">No events listed yet.</p>'}`}
const views={shops,offers,food,info};
function show(t){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));views[t]();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
show("shops");
</script>
